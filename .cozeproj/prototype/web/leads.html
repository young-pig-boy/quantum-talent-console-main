<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/google-all-fonts.css" rel="stylesheet"/>

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #2C3E50;
      --color-primary-container:    #DDE4EA;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面 === */
      --color-background:                 #FAFAF7;
      --color-surface-container-lowest:   #FAFAF7;
      --color-surface-container-low:      #F5F4F0;
      --color-surface:                    #FFFFFF;
      --color-surface-container:          #F2F0EB;
      --color-surface-container-high:     #EDEAE3;
      --color-surface-container-highest:  #E8E5DE;
      /* === 文字 === */
      --color-on-surface:           #151515;
      --color-on-surface-variant:   #77736B;
      /* === 功能色 === */
      --color-success:  #22c55e;
      --color-error:    #C44545;
      --color-warning:  #f59e0b;
      /* === 边框 === */
      --color-outline:          #E6E2DA;
      --color-outline-variant:  #E6E2DA;
      /* === 圆角 === */
      --radius-sm:   0.25rem;
      --radius-md:   0.375rem;
      --radius-lg:   0.5rem;
      --radius-xl:   0.75rem;
      --radius-2xl:  1rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 1px 3px rgba(0,0,0,0.06);
      --shadow-float:  0 8px 24px rgba(0,0,0,0.08);
      --shadow-dialog: 0 20px 48px rgba(0,0,0,0.12);
      /* === 字体 === */
      --font-sans: "Inter", "Noto Sans SC", system-ui, sans-serif;
    }
  </style>

  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- @nav:start 导航组件 -->
  <header class="bg-surface sticky top-0 z-40 h-16 flex items-center justify-between px-6 border-b border-outline-variant/30">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-md bg-primary flex items-center justify-center">
        <i data-lucide="atom" class="w-4.5 h-4.5 text-on-primary"></i>
      </div>
      <span class="font-bold text-lg tracking-tight text-on-surface">Quantum Talent</span>
      <span class="text-xs text-on-surface-variant bg-surface-container px-2 py-0.5 rounded-sm font-medium">控制台</span>
    </div>
    <div class="flex items-center gap-4">
      <button class="relative p-2 rounded-md text-on-surface-variant hover:bg-surface-container transition-colors" id="btn-notifications">
        <i data-lucide="bell" class="w-4.5 h-4.5"></i>
        <span class="absolute top-1 right-1 w-2 h-2 bg-error rounded-full"></span>
      </button>
      <div class="flex items-center gap-2 pl-4 border-l border-outline-variant/30">
        <div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-sm font-medium text-on-surface-variant">初</div>
        <span class="text-sm font-medium text-on-surface hidden sm:block">小初</span>
      </div>
    </div>
  </header>

  <div class="flex" style="height: calc(100vh - 4rem)">
    <aside class="w-56 shrink-0 bg-surface border-r border-outline-variant/20 overflow-y-auto flex flex-col">
      <div class="p-3 space-y-0.5 flex-1">
        <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors" id="nav-dashboard">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>工作台
        </a>
        <a href="companies.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors" id="nav-companies">
          <i data-lucide="building" class="w-4 h-4"></i>公司与岗位
        </a>
        <a href="jobs.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors" id="nav-jobs">
          <i data-lucide="briefcase" class="w-4 h-4"></i>内部岗位
        </a>
        <a href="publications.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors" id="nav-publications">
          <i data-lucide="globe" class="w-4 h-4"></i>公开运营
        </a>
        <div class="my-2 border-t border-outline-variant/20"></div>
        <a href="leads.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md bg-primary/10 text-primary font-medium text-sm" id="nav-leads" aria-current="page">
          <i data-lucide="inbox" class="w-4 h-4"></i>新投递
        </a>
        <a href="talents.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors" id="nav-talents">
          <i data-lucide="users" class="w-4 h-4"></i>人才库
        </a>
        <a href="pipeline.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors" id="nav-pipeline">
          <i data-lucide="kanban" class="w-4 h-4"></i>招聘推进
        </a>
        <div class="my-2 border-t border-outline-variant/20"></div>
        <a href="analytics.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors" id="nav-analytics">
          <i data-lucide="chart-column" class="w-4 h-4"></i>数据分析
        </a>
        <a href="settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors" id="nav-settings">
          <i data-lucide="settings" class="w-4 h-4"></i>系统设置
        </a>
      </div>
      <div class="p-3 border-t border-outline-variant/20">
        <div class="flex items-center gap-2 px-3 py-2 text-xs text-on-surface-variant">
          <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>帮助文档
        </div>
      </div>
    </aside>

    <!-- @main-content:start -->
    <main class="flex-1 min-w-0 overflow-y-auto bg-background p-6">
      <!-- 页面标题栏 -->
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-on-surface">新投递</h1>
        <button class="bg-primary text-on-primary px-4 py-2 rounded-md text-sm font-medium
                       hover:opacity-90 active:scale-[0.98] transition-all inline-flex items-center gap-2" id="btn-add-lead">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>新增 Lead
        </button>
      </div>

      <!-- 搜索与筛选区 -->
      <div class="bg-surface rounded-lg shadow-card p-4 mb-6">
        <div class="flex flex-col gap-4">
          <!-- 搜索框 -->
          <div class="relative">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-on-surface-variant/50"></i>
            <input id="input-search" type="text" placeholder="搜索候选人姓名、手机、邮箱..."
                   class="w-full bg-surface-container border-none rounded-md pl-9 pr-3 py-2 text-sm
                          text-on-surface placeholder:text-on-surface-variant/50
                          focus:outline-none focus:ring-2 focus:ring-primary/30 transition-colors"/>
          </div>
          <!-- 状态筛选 -->
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-xs font-medium text-on-surface-variant mr-1">状态：</span>
            <button class="px-3 py-1 rounded-full text-xs font-medium bg-primary text-on-primary transition-all" id="filter-status-all" data-status="all">全部</button>
            <button class="px-3 py-1 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" id="filter-status-new" data-status="New">New</button>
            <button class="px-3 py-1 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" id="filter-status-viewed" data-status="已查看">已查看</button>
            <button class="px-3 py-1 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" id="filter-status-contacting" data-status="联系中">联系中</button>
            <button class="px-3 py-1 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" id="filter-status-confirmed" data-status="已确认">已确认</button>
            <button class="px-3 py-1 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" id="filter-status-converted" data-status="已转化">已转化</button>
            <button class="px-3 py-1 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" id="filter-status-invalid" data-status="无效">无效</button>
          </div>
          <!-- 渠道筛选 -->
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-xs font-medium text-on-surface-variant mr-1">渠道：</span>
            <button class="px-3 py-1 rounded-full text-xs font-medium bg-primary text-on-primary transition-all" id="filter-channel-all" data-channel="all">全部</button>
            <button class="px-3 py-1 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" id="filter-channel-website" data-channel="官网">官网</button>
            <button class="px-3 py-1 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" id="filter-channel-wechat" data-channel="微信">微信</button>
            <button class="px-3 py-1 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" id="filter-channel-email" data-channel="邮件">邮件</button>
            <button class="px-3 py-1 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" id="filter-channel-manual" data-channel="人工录入">人工录入</button>
          </div>
        </div>
      </div>

      <!-- 数据表格 -->
      <div class="bg-surface rounded-lg shadow-card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="bg-surface-container text-xs font-semibold text-on-surface-variant uppercase tracking-wide">
                <th class="text-left px-4 py-3 whitespace-nowrap">姓名</th>
                <th class="text-left px-4 py-3 whitespace-nowrap">手机</th>
                <th class="text-left px-4 py-3 whitespace-nowrap">邮箱</th>
                <th class="text-left px-4 py-3 whitespace-nowrap">微信</th>
                <th class="text-left px-4 py-3 whitespace-nowrap">来源岗位</th>
                <th class="text-left px-4 py-3 whitespace-nowrap">来源渠道</th>
                <th class="text-left px-4 py-3 whitespace-nowrap">投递时间</th>
                <th class="text-left px-4 py-3 whitespace-nowrap">当前状态
